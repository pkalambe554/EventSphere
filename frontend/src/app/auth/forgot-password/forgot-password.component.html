<div class="auth-screen">
  <aside class="auth-hero">
    <div class="auth-hero__content">
      <p class="auth-hero__eyebrow">EVENTSPHERE</p>
      <h1 class="auth-hero__title">Forgot your<br>password?</h1>
      <p class="auth-hero__sub">No worries — we'll send you a reset link.</p>
    </div>
  </aside>

  <main class="auth-panel">
    <div class="ticket-card">
      <span class="ticket-card__stub">ADMIT ONE</span>

      <ng-container *ngIf="!submitted">
        <h2 class="ticket-card__title">Reset your password</h2>
        <p class="ticket-card__subtitle">Enter your email and we'll send a reset link.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="ticket-form">
          <label class="field">
            <span class="field__label">Email</span>
            <input type="email" formControlName="email" placeholder="you@example.com" />
          </label>

          <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
            {{ loading ? 'Sending…' : 'Send Reset Link' }}
          </button>
        </form>
      </ng-container>

      <ng-container *ngIf="submitted">
        <h2 class="ticket-card__title">Check your email</h2>
        <p class="ticket-card__subtitle">If an account exists for that email, a reset link is on its way.</p>
      </ng-container>

      <p class="ticket-card__footer">Remembered it? <a routerLink="/login">Back to login</a></p>
    </div>
  </main>
</div>
