<div class="auth-screen">
  <aside class="auth-hero">
    <div class="auth-hero__content">
      <p class="auth-hero__eyebrow">EVENTSPHERE</p>
      <h1 class="auth-hero__title">Set a new<br>password</h1>
    </div>
  </aside>

  <main class="auth-panel">
    <div class="ticket-card">
      <span class="ticket-card__stub">ADMIT ONE</span>

      <ng-container *ngIf="!invalidLink">
        <h2 class="ticket-card__title">Choose a new password</h2>
        <p class="ticket-card__subtitle">At least 8 characters.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="ticket-form">
           <label class="field">
          <span class="field__label">New password</span>
          <div class="field__password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="••••••••" />
            <button type="button" class="field__password-toggle" (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </label>

          <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
            {{ loading ? 'Resetting…' : 'Reset Password' }}
          </button>
        </form>
      </ng-container>

      <ng-container *ngIf="invalidLink">
        <h2 class="ticket-card__title">Invalid link</h2>
        <p class="ticket-card__subtitle">This reset link is missing a token. Request a new one.</p>
      </ng-container>

      <p class="ticket-card__footer"><a routerLink="/forgot-password">Request a new link</a></p>
    </div>
  </main>
</div>
